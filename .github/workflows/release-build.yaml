name: Build Main Binary And Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

jobs:
  build-binary:
    uses: ./.github/workflows/build-binary.yaml
    with:
      ref: ${{ inputs.tag || github.ref }}
  github-release:
    name: Create GitHub Release
    needs: build-binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: bili-sync-rs*
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'push' }}
  docker-release:
    name: Create Docker Image
    needs: build-binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Check latest version
        id: latest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ "$RELEASE_TAG" = "$latest" ] && [ -n "$latest" ]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/qiuos/bili-sync-rs
          tags: |
            type=raw,value=latest,enable=${{ steps.latest.outputs.enabled }}
            type=raw,value=${{ inputs.tag || github.ref_name }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
            linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha, scope=${{ github.workflow }}
          cache-to: type=gha, scope=${{ github.workflow }}
